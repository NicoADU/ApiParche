<div class="auth-page">
  <div class="bg-blobs">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
  </div>

  <div class="auth-inner">
    <!-- Header -->
    <div class="auth-brand">
      <div class="logo-mark">🔥</div>
      <h1 class="brand-name">Parche<span>Plan</span></h1>
    </div>

    <div class="auth-card">
      <span class="eyebrow">Únete gratis</span>
      <h2 class="page-title">Crea tu cuenta</h2>

      <form class="auth-form" (ngSubmit)="onRegister()" #f="ngForm">

        <div class="fields-row">
          <div class="field-group" [class.focused]="focused['name']">
            <label class="field-label">Nombre completo *</label>
            <div class="field-wrap">
              <span class="field-icon">👤</span>
              <input class="field-input" type="text" [(ngModel)]="form.name" name="name"
                     placeholder="Juan Restrepo"
                     (focus)="focused['name']=true" (blur)="focused['name']=false" required />
            </div>
          </div>

          <div class="field-group" [class.focused]="focused['program']">
            <label class="field-label">Programa / Carrera</label>
            <div class="field-wrap">
              <span class="field-icon">🎓</span>
              <input class="field-input" type="text" [(ngModel)]="form.program" name="program"
                     placeholder="Ingeniería de Sistemas"
                     (focus)="focused['program']=true" (blur)="focused['program']=false" />
            </div>
          </div>
        </div>

        <div class="field-group" [class.focused]="focused['email']">
          <label class="field-label">Correo universitario *</label>
          <div class="field-wrap">
            <span class="field-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
            <input class="field-input" type="email" [(ngModel)]="form.email" name="email"
                   placeholder="tucorreo@universidad.edu.co"
                   (focus)="focused['email']=true" (blur)="focused['email']=false" required />
          </div>
        </div>

        <div class="field-group" [class.focused]="focused['password']">
          <label class="field-label">Contraseña *</label>
          <div class="field-wrap">
            <span class="field-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input class="field-input" [type]="showPwd?'text':'password'" [(ngModel)]="form.password" name="password"
                   placeholder="Mínimo 8 caracteres"
                   (focus)="focused['password']=true" (blur)="focused['password']=false" required />
            <button type="button" class="toggle-pwd" (click)="showPwd=!showPwd">
              {{ showPwd ? '🙈' : '👁️' }}
            </button>
          </div>
        </div>

        <div class="field-group" [class.focused]="focused['avatar']">
          <label class="field-label">Foto de perfil <span class="optional">(opcional)</span></label>
          <div class="field-wrap">
            <span class="field-icon">🖼️</span>
            <input class="field-input" type="url" [(ngModel)]="form.avatarUrl" name="avatar"
                   placeholder="https://... (URL de imagen)"
                   (focus)="focused['avatar']=true" (blur)="focused['avatar']=false" />
          </div>
        </div>

        <!-- Avatar preview -->
        <div class="avatar-preview" *ngIf="form.avatarUrl">
          <img [src]="form.avatarUrl" alt="Preview" (error)="form.avatarUrl=''" />
          <span>Vista previa de tu foto</span>
        </div>

        <div class="error-banner" *ngIf="errorMsg">⚠️ {{ errorMsg }}</div>

        <button type="submit" class="btn-primary" [disabled]="isLoading">
          <span *ngIf="!isLoading">Crear mi cuenta 🚀</span>
          <span class="dots-loader" *ngIf="isLoading"><span></span><span></span><span></span></span>
        </button>
      </form>

      <p class="switch-link">¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a></p>
    </div>
  </div>
</div>
