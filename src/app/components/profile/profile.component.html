<div class="app-shell">
  <div class="profile-page">

    <!-- Header cover -->
    <div class="profile-cover">
      <div class="cover-gradient"></div>
      <div class="profile-avatar-wrap">
        <img class="profile-avatar" [src]="profile.avatarUrl || 'https://api.dicebear.com/7.x/thumbs/svg?seed='+profile.name" [alt]="profile.name" />
        <div class="avatar-ring"></div>
      </div>
    </div>

    <div class="profile-content">
      <div class="profile-name-row">
        <h1 class="profile-name">{{ profile.name || 'Tu nombre' }}</h1>
        <span class="profile-program">{{ profile.program || 'Programa no definido' }}</span>
      </div>

      <!-- Stats row -->
      <div class="stats-row">
        <div class="stat-item">
          <span class="stat-num">{{ stats.parches }}</span>
          <span class="stat-label">Parches</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-num">{{ stats.planes }}</span>
          <span class="stat-label">Planes</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-num">{{ stats.checkins }}</span>
          <span class="stat-label">Check-ins</span>
        </div>
      </div>

      <!-- Edit form -->
      <div class="card edit-card">
        <h3 class="section-title">Editar perfil</h3>

        <form class="edit-form" (ngSubmit)="onSave()" #f="ngForm">

          <div class="field-group" [class.focused]="focused['name']">
            <label class="field-label">Nombre completo</label>
            <div class="field-wrap">
              <span class="field-icon">👤</span>
              <input class="field-input" type="text" [(ngModel)]="profile.name" name="name"
                     (focus)="focused['name']=true" (blur)="focused['name']=false" />
            </div>
          </div>

          <div class="field-group" [class.focused]="focused['program']">
            <label class="field-label">Programa / Carrera</label>
            <div class="field-wrap">
              <span class="field-icon">🎓</span>
              <input class="field-input" type="text" [(ngModel)]="profile.program" name="program"
                     (focus)="focused['program']=true" (blur)="focused['program']=false" />
            </div>
          </div>

          <div class="field-group" [class.focused]="focused['avatar']">
            <label class="field-label">URL de avatar</label>
            <div class="field-wrap">
              <span class="field-icon">🖼️</span>
              <input class="field-input" type="url" [(ngModel)]="profile.avatarUrl" name="avatar"
                     placeholder="https://..."
                     (focus)="focused['avatar']=true" (blur)="focused['avatar']=false" />
            </div>
          </div>

          <div class="toast-inline success" *ngIf="saved">✅ Perfil guardado exitosamente</div>

          <button type="submit" class="btn-primary" [disabled]="isLoading">
            <span *ngIf="!isLoading">Guardar cambios</span>
            <span class="dots-loader" *ngIf="isLoading"><span></span><span></span><span></span></span>
          </button>
        </form>
      </div>

      <!-- Logout -->
      <button class="btn-logout" (click)="onLogout()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Cerrar sesión
      </button>
    </div>

  </div>
  <app-navbar />
</div>
